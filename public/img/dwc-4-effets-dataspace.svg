<text x="92" y="701" font-size="17" font-weight="800" fill="#14532D" text-anchor="middle">3</text>
<text x="124" y="689" font-size="17.5" font-weight="700" fill="#0F172A">Le coût marginal d'un nouveau projet s'effondre</text>
<text x="124" y="716" font-size="12.5" fill="#64748B">Aujourd'hui chaque outil reconstruit identité, droits d'accès, formats,</text>
<text x="124" y="733" font-size="12.5" fill="#64748B">hébergement et support.</text>
