<text x="86" y="581" font-size="13" font-weight="600" fill="#14532D">Extension de portée, pas dépossession</text>
<text x="68" y="282" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1.1">AUJOURD'HUI</text>
<rect x="68" y="300" width="190" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
<text x="163" y="321" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">eMOBOIS</text>
