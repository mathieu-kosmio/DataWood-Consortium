<text x="799" y="689" font-size="17.5" font-weight="700" fill="#0F172A">La gouvernance existe déjà, la couche technique</text>
<text x="799" y="712" font-size="17.5" font-weight="700" fill="#0F172A">manque</text>
<text x="799" y="739" font-size="12.5" fill="#64748B">Financeurs collectifs, réalisateurs, opérateurs, fédérations : la répartition</text>
<text x="799" y="756" font-size="12.5" fill="#64748B">des rôles est en place.</text>
