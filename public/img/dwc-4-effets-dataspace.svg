<circle cx="763" cy="481" r="3" fill="#16A34A"/>
<text x="783" y="478" font-size="13" font-weight="600" fill="#0F172A">Conformité du bâtiment</text>
<text x="783" y="494" font-size="11" fill="#64748B">Ministères</text>
<rect x="1115" y="293" width="200" height="160" rx="10" fill="#F8FAFC"/>
<text x="1135" y="321" font-size="12.5" font-weight="500" fill="#475569">La conformité est une</text>
<text x="1135" y="343" font-size="12.5" font-weight="500" fill="#475569">obligation individuelle.</text>
<text x="1135" y="365" font-size="12.5" font-weight="500" fill="#475569"></text>
<text x="1135" y="387" font-size="12.5" font-weight="600" fill="#14532D">L'infrastructure qui permet</text>
<text x="1135" y="409" font-size="12.5" font-weight="600" fill="#14532D">d'y répondre est un</text>
<text x="1135" y="431" font-size="12.5" font-weight="600" fill="#14532D">bien collectif.</text>
