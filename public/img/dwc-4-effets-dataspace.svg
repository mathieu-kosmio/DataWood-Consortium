<text x="767" y="193" font-size="17" font-weight="800" fill="#14532D" text-anchor="middle">2</text>
<text x="799" y="181" font-size="17.5" font-weight="700" fill="#0F172A">Les chaînes que personne ne peut construire seule</text>
<text x="799" y="204" font-size="17.5" font-weight="700" fill="#0F172A">deviennent possibles</text>
<text x="799" y="231" font-size="12.5" fill="#64748B">Chaque maillon existe déjà. Aucune organisation ne les détient tous.</text>
<rect x="743" y="556" width="589" height="40" rx="8" fill="#F0FDF4" stroke="#DCFCE7"/>
<rect x="743" y="556" width="4" height="40" rx="2" fill="#16A34A"/>
