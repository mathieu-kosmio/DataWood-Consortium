<text x="1265" y="1024" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="middle">en place</text>
<rect x="40" y="1144" width="1320" height="44" rx="10" fill="#0F172A"/>
<text x="700.0" y="1172" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">L'espace de données ne remplace aucun outil. Il raccorde les 53 dispositifs existants et transforme chacun en cas d'usage d'une infrastructure commune.</text>
