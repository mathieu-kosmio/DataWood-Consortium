<rect x="40" y="46" width="5" height="48" rx="2.5" fill="#16A34A"/>
<text x="60" y="70" font-size="27" font-weight="700" fill="#0F172A">Ce qu'un espace de données change pour la filière forêt-bois</text>
<text x="60" y="96" font-size="14" fill="#64748B">Quatre effets sur les 53 outils numériques déjà déployés, cartographie DataWood Consortium, juin 2026</text>
<rect x="40" y="136" width="645" height="478" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="40" y="136" width="7" height="478" rx="3.5" fill="#16A34A"/>
<circle cx="92" cy="186" r="19" fill="#DCFCE7"/>
<text x="92" y="193" font-size="17" font-weight="800" fill="#14532D" text-anchor="middle">1</text>
<text x="124" y="181" font-size="17.5" font-weight="700" fill="#0F172A">Chaque outil devient un cas d'usage, sans être</text>
<text x="124" y="204" font-size="17.5" font-weight="700" fill="#0F172A">remplacé</text>
<text x="124" y="231" font-size="12.5" fill="#64748B">Le porteur garde son outil, sa gouvernance et son modèle. Il gagne l'accès à</text>
<text x="124" y="248" font-size="12.5" fill="#64748B">la donnée des autres.</text>
<rect x="68" y="556" width="589" height="40" rx="8" fill="#F0FDF4" stroke="#DCFCE7"/>
