server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Maquette Passeport produit bâtiment : fichiers versionnés, mis en cache longtemps
    location /passeport/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pages HTML revalidées à chaque visite : après un déploiement, une page gardée en cache
    # réclamerait des fichiers versionnés qui n'existent plus (page blanche)
    location /passeport/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /passeport/404.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Site : fichiers versionnés par Vite, mis en cache longtemps ; un fichier absent renvoie 404, pas la page d'accueil
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
